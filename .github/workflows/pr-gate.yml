name: documentation gate on pull requests
# Runs the same gate lambda/deploy.py runs before a deploy, so a drafted fix cannot be merged if it contradicts a known fact,
# states one fact two ways, revives a banned phrase, or adds an unreviewed absolute claim. Pure standard-library Python; no secrets.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: documentation gate
        run: python scripts/gate_docs.py
      - name: front renders
        run: python scripts/build_front.py
